plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  Exclude:
    - binstub/**
    - exe/**
    - vendor/**
    - Gemfile*
    - TODO.md
  NewCops: enable
  TargetRubyVersion: 3.4

Gemspec/RequireMFA:
  Enabled: false

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 45

Metrics/BlockLength:
  Max: 30

Metrics/ClassLength:
  Max: 150

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 40

Metrics/ModuleLength:
  Enabled: false

# The launcher takes the options of a run as keyword arguments.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Max: 15

# The harness examples assert the whole result of a launch: the exit code, the dialog, its
# classification, and the outcome. Splitting them would assert less of the contract.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

# The window search and the permission prompt are parts of the PowerShell script, and the
# script is not a class.
RSpec/DescribeClass:
  Exclude:
    - spec/gui_harness/window_search_spec.rb
    - spec/gui_harness/permission_prompt_spec.rb

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
